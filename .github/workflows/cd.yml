name: CD — Deploy container to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require current master and successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          if [[ "$current_sha" != "$IMAGE_TAG" ]]; then
            echo "::error::This revision has been superseded on master; refusing to deploy an older commit."
            exit 1
          fi
          ci_runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=master -f event=push -f head_sha="$IMAGE_TAG" -f per_page=1)
          if ! jq --exit-status --arg sha "$IMAGE_TAG" --arg repo "$GITHUB_REPOSITORY" \
            '.workflow_runs[0] |
             .head_sha == $sha and .head_branch == "master" and .event == "push" and
             .head_repository.full_name == $repo and
             .status == "completed" and .conclusion == "success"' <<< "$ci_runs" > /dev/null; then
            echo "::error::The latest push CI run for this master revision must have completed successfully. Wait for CI or fix it before retrying."
            exit 1
          fi

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate existing deployment targets
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Set the production environment variable AZURE_RESOURCE_GROUP}"
          : "${AZURE_APP_NAME:?Set the production environment variable AZURE_APP_NAME}"
          : "${AZURE_REGISTRY_SERVER:?Set the production environment variable AZURE_REGISTRY_SERVER}"
          az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_NAME" \
            --query id --output tsv > /dev/null

      - name: Login to the template ACR repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_REGISTRY_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.AZURE_REGISTRY_SERVER }}/intranet:${{ env.IMAGE_TAG }}

      - name: Deploy image to the existing App Service
        shell: bash
        run: |
          set -euo pipefail
          image="${AZURE_REGISTRY_SERVER}/intranet:${IMAGE_TAG}"
          az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_NAME" \
            --linux-fx-version "DOCKER|${image}" --output none
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_NAME"
          host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_NAME" --query defaultHostName --output tsv)
          curl --fail --silent --show-error --retry 30 --retry-delay 10 \
            --retry-all-errors --max-time 30 "https://${host}/health"
